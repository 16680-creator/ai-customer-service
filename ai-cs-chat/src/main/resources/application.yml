server:
  port: 8083

spring:
  application:
    name: ai-cs-chat
  # 彻底排除 Embedding 自动配置（与 @SpringBootApplication.exclude 双保险）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:aics-shared.yml
      - optional:nacos:ai-cs-chat.yml

  # ===== Chroma 向量库连接配置 =====
  # 统一放在 Nacos（ai-cs-chat.yml）管理，见 deploy/nacos/configs/ai-cs-chat.yml
  # 占位符默认值保证 Nacos 不可用时本地也能用 localhost:8000 兜底
  ai:
    # 禁用 Spring AI 内置 Embedding 自动装配（由 SpringAiConfig 手动提供）
    model:
      embedding:
        enabled: false
    vectorstore:
      chroma:
        initialize-schema: true
        collection-name: aics-knowledge
        client:
          host: http://${aics.mysql.host:localhost}   # 复用 MySQL 主机，需带 http:// 协议头
          port: ${CHROMA_PORT:8000}
