# ai-cs-frontend 生产站点配置
#
# 三件事必须做对，否则上线就是"本地好的、线上炸了"：
#   1) history 路由深链接刷新 404 -> try_files 兜底到 index.html
#   2) index.html 不能被缓存 -> 否则发版后用户的浏览器还拿着旧 HTML、引用了已删除的旧 chunk，白屏
#   3) /api 反代网关，且 SSE 不能缓冲 -> 否则 AI 打字机效果消失（攒成一坨才返回）

upstream aics_gateway {
    # docker-compose 里服务名是 api-gateway；k8s 里是 api-gateway.ai-customer-service.svc.cluster.local
    # 用变量 + resolver 会让配置复杂化，这里按 compose 网络约定写死，k8s 部署时用 ConfigMap 覆盖本行
    server api-gateway:8080;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 请求体上限：知识库上传、图片上传走这个入口，默认 1m 会 413
    client_max_body_size 20m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;

    # ---------- 静态资源：带 hash 的文件可以永久缓存 ----------
    # Vite 产出的 assets/* 文件名里带 content hash，内容一变文件名就变，
    # 所以可以放心 immutable，省掉 304 往返。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- index.html：绝对不能缓存 ----------
    # 它是"引用表"，发版后必须立刻拿到新的，否则会去请求已经被删掉的旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---------- API 反代到网关 ----------
    # 前端代码里的 BASE_URL 是 '/api'（见 src/utils/runtime.js），
    # 所以这里直接透传，不要 rewrite 掉 /api 前缀（网关的路由表就带 /api）。
    location /api/ {
        proxy_pass         http://aics_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE 必须走 HTTP/1.1 且关闭缓冲，否则 token 被攒起来一次性返回
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;   # 大模型首 token 可能很慢，默认 60s 会 504
        chunked_transfer_encoding on;
    }

    # ---------- SPA 兜底 ----------
    # /chat、/order/123、/knowledge 这些路由在前端是 vue-router 管的，
    # 服务端没有对应文件。try_files 找不到就交给 index.html，由前端路由接管。
    # 少了这一行，用户刷新任何子页面都会 404（06/09 与 06/16 反复强调的点）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不暴露 nginx 版本号
    server_tokens off;
}
