server:
  shutdown: graceful
  port: 8080

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: ai-cs-gateway
  data:
    # RequestRateLimiter（Redis + Lua 分布式令牌桶）的连接配置；
    # Redis 不可用时分布式限流失效，可临时把下方 aics.gateway.rate-limit.enabled
    # 改回 true 切回本地内存限流兜底
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:aics-shared.yml
      - optional:nacos:ai-cs-gateway.yml

# ===== 网关能力配置（限流 / 鉴权 / 负载均衡） =====
aics:
  gateway:
    rate-limit:
      # 旧版本地内存限流（单机配额、多实例不共享）：默认关闭，
      # 已由 RouteConfig 里每路由的 RequestRateLimiter（Redis 分布式令牌桶）替代；
      # Redis 不可用时改回 true 兜底
      enabled: false
      # 限流算法：sliding-window（滑动窗口，requests/window-seconds 生效）
      #          | token-bucket（令牌桶，qps 生效，允许短时突发、限制长期平均速率）
      algorithm: sliding-window
      requests: 60
      window-seconds: 60
      qps: 5
      # 分布式限流（RequestRateLimiter）：每用户每秒补充令牌数与桶容量
      replenish-rate: 5
      burst-capacity: 10
    auth:
      # API Key 白名单：格式 keyId:secret，逗号分隔（如 svc-app:sk-xxxx,svc-job:sk-yyyy）
      # 空 = 关闭 API Key 认证（仅 JWT）；keyId 校验通过后作为 X-User-Id 透传下游
      api-keys: ""
    loadbalancer:
      # 负载均衡算法：round-robin（轮询，Spring Cloud LoadBalancer 默认）
      #             | least-connections（最少连接，按实例在途请求数分流）
      algorithm: round-robin

# ===== 全链路追踪（03-P5）：OTLP 导出至 OTel Collector（observability compose 4318 端口） =====
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # 生产可调低采样率，本地全采样
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
