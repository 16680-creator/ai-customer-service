server:
  shutdown: graceful
  port: 8082

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: ai-cs-knowledge
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:aics-shared.yml
      - optional:nacos:ai-cs-knowledge.yml
  # ===== Chroma 向量库（与 ai-cs-chat 共用 aics-knowledge 集合）=====
  ai:
    vectorstore:
      chroma:
        initialize-schema: true
        collection-name: aics-knowledge
        client:
          host: http://${aics.mysql.host:localhost}
          port: ${CHROMA_PORT:8000}

# ===== 全链路追踪（03-P5）：OTLP 导出至 OTel Collector（observability compose 4318 端口） =====
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # 生产可调低采样率，本地全采样
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
