server:
  shutdown: graceful
  port: 8087

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: ai-cs-order
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: aics
        group: DEFAULT_GROUP
        file-extension: yml
  config:
    import:
      - optional:nacos:aics-shared.yml
      - optional:nacos:ai-cs-order.yml
  cloud:
    openfeign:
      # Feign 熔断（03-P2）：所有 Feign 调用自动包裹 Resilience4j CircuitBreaker，
      # 实例名 = FeignClient contextId（productClient / payClient）；
      # 降级行为由各 FallbackFactory 决定：读类/关键写类快速失败，尽力而为类 fail+告警
      circuitbreaker:
        enabled: true

# ===== Seata AT 分布式事务（order 为全局事务发起方） =====
# registry=file + grouplist：本地开发直连 TC，不依赖注册中心；集群部署可切 nacos registry
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: aics_tx_group
  service:
    vgroup-mapping:
      aics_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT
  enable-auto-data-source-proxy: true

# ===== XXL-Job 执行器（默认关闭，本地无 admin 也能启动；见 learning-docs 07-运维部署） =====
aics:
  xxl-job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8099/xxl-job-admin}
    access-token: default_token
    executor:
      port: 9999

# ===== 全链路追踪（03-P5）：OTLP 导出至 OTel Collector（observability compose 4318 端口） =====
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # 生产可调低采样率，本地全采样
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
