# ============================================================
# Secret 模板文件 —— 存放中间件的敏感信息（密码、Token 等）
# ------------------------------------------------------------
# 使用步骤：
#   1. 把本文件复制一份改名为 middleware-secrets.yaml
#   2. 把 replace-with-xxx 占位符换成真实值
#   3. 执行：kubectl apply -f deploy/k8s/middleware-secrets.yaml
# 注意：middleware-secrets.yaml 含真实密码，不要提交到 Git！
#       （本 example 文件只有占位符，可以安全提交）
# ------------------------------------------------------------
# Secret 的两种存值方式：
#   stringData —— 直接写明文（本文件用法，K8s 落库时会自动 base64 编码）
#   data       —— 需要自己先 base64 编码再写进来
# type: Opaque —— 通用类型，表示“用户自定义的键值对”，K8s 不做特殊解释
# ============================================================

# ---------- Secret 1：Neo4j 图数据库的认证信息 ----------
# 被 neo4j.yaml 的 StatefulSet 引用：
#   env NEO4J_AUTH -> secretKeyRef { name: neo4j-secret, key: auth }
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret                # Secret 名称，neo4j.yaml 通过这个名字引用
  namespace: ai-customer-service    # 必须与引用它的 Pod 在同一命名空间
type: Opaque                        # 通用键值对类型
stringData:
  # 格式：neo4j/<strong-password>
  # Neo4j 官方约定：auth 环境变量 = “用户名/密码”，斜杠前是用户名，后面是密码
  auth: neo4j/replace-with-strong-password
---
# ---------- Secret 2：XXL-Job 调度中心 admin 的启动参数 ----------
# 被 xxl-job.yaml 的 Deployment 引用：
#   env PARAMS -> secretKeyRef { name: xxl-job-admin-config, key: params }
apiVersion: v1
kind: Secret
metadata:
  name: xxl-job-admin-config        # Secret 名称，xxl-job.yaml 通过这个名字引用
  namespace: ai-customer-service
type: Opaque
stringData:
  # `>-` 是 YAML 折叠语法：把多行拼成“用空格连接的一行”，
  # 最终值等价于 --spring.datasource.url=... --spring.datasource.username=... 追加在一行，
  # XXL-Job 镜像会把这个值作为 JVM 程序参数（覆盖 Spring Boot 的配置）
  params: >-
    --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    --spring.datasource.username=root
    --spring.datasource.password=replace-with-real-password
    --xxl.job.accessToken=replace-with-real-token
