# ============================================================
# Nacos 部署 —— 微服务注册中心 + 配置中心
# ------------------------------------------------------------
# 作用：所有微服务（网关、用户、知识库…）启动时把自己注册到 Nacos，
#       服务之间靠它互相发现；配置也集中存在这里
# 部署顺序：需要 MySQL 已就绪（元数据存 MySQL 的 nacos_config 库）
# 部署命令：kubectl apply -f deploy/k8s/nacos.yaml
# 访问方式：http://<节点IP>:<NodePort>/nacos（如配置了）或集群内 nacos:8848
# ============================================================

# ---------- 第一部分：Service（集群内访问入口） ----------
apiVersion: v1
kind: Service
metadata:
  name: nacos                   # Service 名，微服务的 NACOS_ADDR=nacos:8848 指向它
  namespace: ai-customer-service
  labels:
    app: nacos
spec:
  type: ClusterIP               # 仅集群内访问
  ports:
    - port: 8848                # 8848：HTTP 控制台/OpenAPI 端口
      targetPort: 8848
      name: http
    - port: 9848                # 9848：gRPC 端口（Nacos 2.x 客户端实际走这个）
      targetPort: 9848          # 客户端会先连 8848 再自动偏移到 8848+1000=9848
      name: grpc
  selector:
    app: nacos                  # 后端 Pod 标签
---
# ---------- 第二部分：Deployment（无状态部署） ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: ai-customer-service
  labels:
    app: nacos
spec:
  replicas: 1                   # 单副本（生产建议 3 副本集群，学习环境 1 个够用）
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2   # 固定版本，与本地 tools/nacos 目录版本一致
          ports:
            - containerPort: 8848         # HTTP 端口
              name: http
            - containerPort: 9848         # gRPC 端口
              name: grpc
          env:                            # ---- Nacos 官方镜像的环境变量约定 ----
            - name: MODE
              value: "standalone"         # 单机模式（默认是 cluster，必须显式改掉）
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"              # 元数据落库用 MySQL（默认 derby 内嵌库）
            - name: MYSQL_SERVICE_HOST
              value: "mysql"              # MySQL 的 Service 名（K8s 集群内 DNS）
            - name: MYSQL_SERVICE_PORT
              value: "3306"
            - name: MYSQL_SERVICE_DB_NAME
              value: "nacos_config"       # Nacos 专用数据库（建库脚本见 deploy/mysql）
            - name: MYSQL_SERVICE_USER
              value: "root"
            - name: MYSQL_SERVICE_PASSWORD
              value: "root"               # 学习环境简单密码；生产应改用 Secret
            - name: JVM_XMS
              value: "256m"               # JVM 初始堆大小（学习环境给小，省资源）
            - name: JVM_XMX
              value: "512m"               # JVM 最大堆大小
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:                  # 存活探测：挂了自动重启
            httpGet:
              path: /nacos/v1/console/health/readiness  # Nacos 官方就绪接口
              port: 8848
            initialDelaySeconds: 60       # Nacos 启动慢，等 60 秒
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:                 # 就绪探测：通过才接流量
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
