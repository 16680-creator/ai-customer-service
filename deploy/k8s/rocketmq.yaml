# ============================================================
# RocketMQ 部署 —— 消息队列（异步削峰、事件驱动）
# ------------------------------------------------------------
# 由两个组件组成，缺一不可：
#   NameServer —— “通讯录”：Broker 启动时向它上报地址，客户端问它要 Broker 列表
#   Broker     —— “仓库”：真正存消息、收发消息的组件
# 部署顺序：先 NameServer，后 Broker（Broker 启动时要连 NameServer）
# 部署命令：kubectl apply -f deploy/k8s/rocketmq.yaml
# ============================================================

# ---------- 第一部分：NameServer 的 Service ----------
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv        # Broker 的 NAMESRV_ADDR 就填这个名字
  namespace: ai-customer-service
  labels:
    app: rocketmq-namesrv
spec:
  type: ClusterIP
  ports:
    - port: 9876                # NameServer 固定监听端口
      targetPort: 9876
      name: namesrv
  selector:
    app: rocketmq-namesrv
---
# ---------- 第二部分：NameServer 的 Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: ai-customer-service
  labels:
    app: rocketmq-namesrv
spec:
  replicas: 1                   # 单副本 NameServer（生产建议 ≥2 保证可用性）
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.1.4    # RocketMQ 5.1.4 官方镜像
          ports:
            - containerPort: 9876
              name: namesrv
          command: ["sh", "mqnamesrv"]    # 覆盖容器默认命令：启动 NameServer 角色
          env:
            - name: JAVA_OPT_EXT
              value: "-server -Xms256m -Xmx256m"  # JVM 堆固定 256MB（NameServer 很轻量）
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:          # 存活探测：TCP 端口能连通即可
            tcpSocket:
              port: 9876
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:         # 就绪探测：端口通才算准备好服务
            tcpSocket:
              port: 9876
            initialDelaySeconds: 10
            periodSeconds: 5
---
# ---------- 第三部分：Broker 的 Service ----------
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: ai-customer-service
  labels:
    app: rocketmq-broker
spec:
  type: ClusterIP
  ports:
    - port: 10911               # 10911：Broker 主端口（收发消息）
      targetPort: 10911
      name: broker
    - port: 10909               # 10909：VIP 通道端口（主端口-2，快速通道，本质同端口监听）
      targetPort: 10909
      name: broker-fast
  selector:
    app: rocketmq-broker
---
# ---------- 第四部分：Broker 的 Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: ai-customer-service
  labels:
    app: rocketmq-broker
spec:
  replicas: 1                   # 单 Broker（生产环境通常主从/多副本）
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
        - name: broker
          image: apache/rocketmq:5.1.4
          ports:
            - containerPort: 10911
              name: broker
            - containerPort: 10909
              name: broker-fast
          # -n 参数：告诉 Broker NameServer 的地址（启动后自动注册）
          command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876"]
          env:
            - name: JAVA_OPT_EXT
              value: "-server -Xms512m -Xmx512m"  # Broker 堆 512MB（比 NameServer 大）
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:          # 存活探测：Broker 主端口 10911
            tcpSocket:
              port: 10911
            initialDelaySeconds: 30   # Broker 启动比 NameServer 慢，多等一会
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10911
            initialDelaySeconds: 15
            periodSeconds: 5
