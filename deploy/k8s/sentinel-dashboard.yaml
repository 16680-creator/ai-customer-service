apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: ai-customer-service
spec:
  selector:
    app: sentinel-dashboard
  ports:
    - name: http
      port: 8858
      targetPort: 8858
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: ai-customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.6
          ports:
            - containerPort: 8858
          env:
            - name: JAVA_OPTS
              value: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=sentinel-dashboard:8858 -Dproject.name=sentinel-dashboard"
          readinessProbe:
            httpGet:
              path: /
              port: 8858
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8858
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
