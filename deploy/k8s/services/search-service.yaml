# ============================================================
# 搜索服务（search-service）部署
# ------------------------------------------------------------
# 职责：知识库全文检索（对 Elasticsearch 建索引/查询）
# 依赖：Elasticsearch（必须先部署好 ES）
# 部署命令：kubectl apply -f deploy/k8s/services/search-service.yaml
# 集群内访问：http://search-service:8084
# ============================================================

# ---------- 第一部分：Service（集群内访问入口） ----------
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: ai-customer-service
  labels:
    app: search-service
spec:
  type: ClusterIP               # 仅集群内，外部流量走网关
  ports:
    - port: 8084                # Service 端口
      targetPort: 8084          # 容器端口
      name: http
  selector:
    app: search-service         # 后端 Pod 标签
---
# ---------- 第二部分：Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: ai-customer-service
  labels:
    app: search-service
spec:
  replicas: 1                   # 单副本
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: 192.168.56.12:5000/aics/search-service:latest
          # ↑ 私有镜像仓库（192.168.56.12:5000），构建推送见 k8s-build-push.sh
          imagePullPolicy: IfNotPresent   # 本地有镜像就不重新拉取
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: NACOS_ADDR
              value: "nacos:8848"          # 注册/配置中心
            - name: NACOS_NAMESPACE
              value: ""                    # Nacos 命名空间（空=public）
            - name: ELASTICSEARCH_URIS
              value: "http://elasticsearch:9200"   # ES 的 HTTP API 地址
                                                   # （与 k8s/elasticsearch.yaml 的 Service 名对应）
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx256m"   # JVM 堆 256MB
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:          # 存活探测
            tcpSocket:
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:         # 就绪探测
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
