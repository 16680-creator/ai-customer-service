apiVersion: v1
kind: Service
metadata:
  name: xxl-job-admin
  namespace: ai-customer-service
spec:
  selector:
    app: xxl-job-admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxl-job-admin
  namespace: ai-customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xxl-job-admin
  template:
    metadata:
      labels:
        app: xxl-job-admin
    spec:
      containers:
        - name: xxl-job-admin
          image: xuxueli/xxl-job-admin:2.4.1
          ports:
            - containerPort: 8080
          env:
            - name: PARAMS
              valueFrom:
                secretKeyRef:
                  name: xxl-job-admin-config
                  key: params
          readinessProbe:
            httpGet:
              path: /xxl-job-admin/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /xxl-job-admin/
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
