# AI 对话服务配置（Nacos dataId: ai-cs-chat.yml）
spring:
  ai:
    openai:
      api-key: ${aics.openai.api-key:}
      base-url: ${aics.openai.base-url:https://api.deepseek.com}
      chat:
        options:
          model: ${aics.openai.model:deepseek-chat}
          temperature: 0.7
          max-tokens: 2048
    # 向量库 Chroma 连接配置（含 IP/端口，统一收口到 Nacos 管理）
    # 依赖 spring-ai-starter-vector-store-chroma，服务需先启动：
    #   docker run -d --name chroma -p 8000:8000 chromadb/chroma
    vectorstore:
      chroma:
        initialize-schema: true        # 首次启动自动建集合(collection)
        collection-name: aics-knowledge # 向量集合名（隔离靠 metadata.knowledgeBase 过滤）
        client:
          host: ${aics.mysql.host:localhost}   # Chroma 服务地址（复用 MySQL 主机，保证同机部署一致）
          port: ${CHROMA_PORT:8000}            # Chroma 服务端口

logging:
  level:
    com.aics.chat: debug
    org.springframework.ai: info
