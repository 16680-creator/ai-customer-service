version: '3.8'

# AI客服系统 - 单机版基础设施编排
# 包含: MySQL单节点、Redis单节点、Nacos、Elasticsearch、RocketMQ、MinIO
# 可选(Kafka 双栈开关, 见 learning-docs/04-中间件/12):
#   docker compose --profile kafka up -d kafka kafka-init
#   配合 ai-cs-mq 以 SPRING_PROFILES_ACTIVE=kafka 启动

services:
  # ==================== MySQL 单节点 ====================
  mysql:
    image: mysql:8.0
    container_name: aics-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./deploy/mysql/xxl-job-init.sql:/docker-entrypoint-initdb.d/xxl-job-init.sql
      - ./deploy/mysql/canal-init.sql:/docker-entrypoint-initdb.d/canal-init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aics-network

  # ==================== Redis 单节点 ====================
  redis:
    image: redis:7
    container_name: aics-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aics-network

  # ==================== Nacos 注册中心/配置中心 ====================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: aics-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      JVM_XMS: 256m
      JVM_XMX: 512m
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - aics-network

  # ==================== Elasticsearch 搜索引擎 ====================
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: aics-elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - aics-network

  # ==================== RocketMQ 消息队列 ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: aics-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check' | nc -w 2 localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aics-network

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: aics-rocketmq-broker
    restart: always
    ports:
      - "10911:10911"
      - "10909:10909"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check' | nc -w 2 localhost 10911 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aics-network

  # ==================== MinIO 对象存储 ====================
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /data/minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aics-network

  # ==================== 对话审计文档库（MongoDB） ====================
  mongodb:
    image: mongo:7.0
    container_name: aics-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aics_chat
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' localhost:27017/test | grep 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aics-network

  # ==================== AI 数据层（向量库 / 图数据库） ====================
  chroma:
    image: chromadb/chroma:0.5.20
    container_name: aics-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/heartbeat\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aics-network

  neo4j:
    image: neo4j:5-community
    container_name: aics-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/aics-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - aics-network

  # ==================== 调度与流控控制台 ====================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: aics-xxl-job-admin
    restart: always
    ports:
      - "8099:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.accessToken=default_token
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/xxl-job-admin/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - aics-network

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: aics-sentinel-dashboard
    restart: always
    ports:
      - "8858:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8858/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - aics-network

  # ==================== Kafka（可选双栈开关，profile=kafka 时启动） ====================
  # KRaft 单节点模式，不需要 ZooKeeper（Kafka 3.3+ 生产可用，4.0 起唯一模式）
  # 默认不启动：只有 docker compose --profile kafka up -d 才会拉起
  kafka:
    image: apache/kafka:3.7.1
    container_name: aics-kafka
    restart: always
    profiles:
      - kafka
    ports:
      # PLAINTEXT 监听器：宿主机/IDE 里的服务用 localhost:9092
      - "9092:9092"
    environment:
      # --- KRaft 角色与仲裁 ---
      CLUSTER_ID: aics-kafka-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # --- 三套监听器：外部(宿主)/控制器/容器内互访 ---
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 单节点副本因子必须为 1，否则创建 topic 会报 replica 不满足 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # 没有这个卷：Kafka 重启后消息与 offset 全部丢失
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - aics-network

  # 一次性任务：预创建工单主题与死信主题
  # Kafka 与 RocketMQ 的一个重要差异——Topic 通常需要预先创建并规划分区数，
  # 而不是像 RocketMQ 那样默认由发送方自动创建
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: aics-kafka-init
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BOOTSTRAP=kafka:29092
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists \
          --topic work-order-topic --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists \
          --topic work-order-topic-dlt --partitions 3 --replication-factor 1
        echo "--- topic 列表 ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --list
    networks:
      - aics-network

# ==================== 数据卷 ====================
volumes:
  mysql-data:
  redis-data:
  es-data:
  mongodb-data:
  chroma-data:
  neo4j-data:
  neo4j-logs:
  kafka-data:

# ==================== 网络 ====================
networks:
  aics-network:
    driver: bridge
    name: aics-network
