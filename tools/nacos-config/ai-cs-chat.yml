spring:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048

# Rerank 重排序（RAG 精度提升，硅基流动 bge-reranker-v2-m3）
aics:
  rerank:
    base-url: https://api.siliconflow.cn
    api-key: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-reranker-v2-m3
    top-n: 5
    min-score: 0.7
    timeout-ms: 5000

  # RAG 两阶段检索配置
  rag:
    recall-top-k: 20
    recall-threshold: 0.5
