spring:
  data:
    redis:
      connect-timeout: 15000   # 远程 Redis：Redisson 握手需要更长超时
      timeout: 15000
      password:                # 覆盖 shared 的空串密码（null）：Redis 未设密码，
                               # Redisson 会拿空串发 AUTH 被拒（Lettuce 则自动跳过）
  datasource:
    url: jdbc:mysql://123.60.31.79:3306/ai_customer_service?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1500000
      connection-timeout: 30000

# RocketMQ producer group (auto-creates RocketMQTemplate Bean)
rocketmq:
  producer:
    group: order-producer-group

order:
  timeout-minutes: 30