# 用户服务 Nacos 配置
# 数据源已切换为 ShardingSphere 分库分表（user_db_0/user_db_1 各 4 张 sys_user 表）
# 连接信息在 ai-cs-user.jar 内的 sharding-user.yaml 中管理（支持 DB_HOST/DB_PASSWORD 环境变量覆盖）
spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding-user.yaml?placeholder-type=ENVIRONMENT
