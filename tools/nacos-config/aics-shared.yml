# ===== 可观测性：Actuator 端点 + Prometheus 指标（所有服务统一暴露） =====
# 抓取端点：http://{host}:{port}/actuator/prometheus（见 deploy/observability/prometheus.yml）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
